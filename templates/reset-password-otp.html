{% extends "base.html" %}

{% block content %}
<section class="password-reset">
  <div class="reset-card">
    <div class="reset-header">
      <h1>Reset Password</h1>
      <p>Enter the OTP sent to {{ email }} and your new password</p>
    </div>
    <form id="resetPasswordOtpForm" method="POST" class="reset-form">
      <input type="hidden" name="email" value="{{ email }}">
      <div class="form-group floating-label-group">
        <input type="text" id="otp" name="otp" required placeholder=" " maxlength="6">
        <label for="otp">OTP Code</label>
      </div>
      <div class="form-group floating-label-group">
        <input type="password" id="new_password" name="new_password" required placeholder=" " minlength="8">
        <label for="new_password">New Password</label>
      </div>
      <div class="form-group floating-label-group">
        <input type="password" id="confirm_password" name="confirm_password" required placeholder=" ">
        <label for="confirm_password">Confirm Password</label>
        <div class="password-requirements">
          <p class="requirements-title">Password must contain:</p>
          <ul class="requirements-list">
            <li class="requirement" data-requirement="length">At least 8 characters</li>
            <li class="requirement" data-requirement="number">At least one number</li>
            <li class="requirement" data-requirement="uppercase">At least one uppercase letter</li>
          </ul>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">
        <span class="btn-text">Reset Password</span>
        <i class="fas fa-spinner fa-spin loading-icon" style="display: none;"></i>
      </button>
    </form>
    <div id="formResponse" class="form-response" style="display: none;"></div>
    <div class="reset-footer">
      <p>Didn't receive OTP? <a href="#" id="resendOtp">Resend</a></p>
    </div>
  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('resetPasswordOtpForm');
  const submitBtn = form.querySelector('button[type="submit"]');
  const btnText = submitBtn.querySelector('.btn-text');
  const loadingIcon = submitBtn.querySelector('.loading-icon');
  const formResponse = document.getElementById('formResponse');
  const resendOtpBtn = document.getElementById('resendOtp');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    
    btnText.textContent = 'Processing...';
    loadingIcon.style.display = 'inline-block';
    formResponse.style.display = 'none';

    const formData = {
      email: form.querySelector('[name="email"]').value,
      otp: form.querySelector('[name="otp"]').value,
      new_password: form.querySelector('[name="new_password"]').value,
      confirm_password: form.querySelector('[name="confirm_password"]').value
    };

    fetch('/reset-password-otp', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(formData)
    })
    .then(response => {
      if (!response.ok) {
        return response.json().then(err => { throw err; });
      }
      return response.json();
    })
    .then(data => {
      if (data.status === 'success') {
        formResponse.className = 'form-response success';
        formResponse.textContent = data.message;
        
        if (data.redirect) {
          setTimeout(() => {
            window.location.href = data.redirect;
          }, 1500);
        }
      } else {
        throw new Error(data.message || 'Password reset failed');
      }
    })
    .catch(error => {
      formResponse.className = 'form-response error';
      formResponse.textContent = error.message || 'An error occurred. Please try again.';
    })
    .finally(() => {
      btnText.textContent = 'Reset Password';
      loadingIcon.style.display = 'none';
      formResponse.style.display = 'block';
    });
  });

  resendOtpBtn.addEventListener('click', function(e) {
    e.preventDefault();
    const email = form.querySelector('[name="email"]').value;
    
    fetch('/api/send-otp', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ email })
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === 'success') {
        showToast('New OTP sent successfully!', 'success');
      } else {
        throw new Error(data.error || 'Failed to resend OTP');
      }
    })
    .catch(error => {
      showToast(error.message, 'error');
    });
  });

  function showToast(message, type) {
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;
    document.body.appendChild(toast);

    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => document.body.removeChild(toast), 300);
    }, 3000);
  }
});
  // Add this to your reset-password-otp.html script
const passwordInput = document.getElementById('new_password');
const requirements = {
  length: document.querySelector('[data-requirement="length"]'),
  number: document.querySelector('[data-requirement="number"]'),
  uppercase: document.querySelector('[data-requirement="uppercase"]')
};

passwordInput.addEventListener('input', function() {
  const value = this.value;

  // Check length
  if (value.length >= 8) {
    requirements.length.classList.add('valid');
  } else {
    requirements.length.classList.remove('valid');
  }

  // Check for number
  if (/\d/.test(value)) {
    requirements.number.classList.add('valid');
  } else {
    requirements.number.classList.remove('valid');
  }

  // Check for uppercase
  if (/[A-Z]/.test(value)) {
    requirements.uppercase.classList.add('valid');
  } else {
    requirements.uppercase.classList.remove('valid');
  }
});
</script>
{% endblock %}
