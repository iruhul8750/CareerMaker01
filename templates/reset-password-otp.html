{% extends "base.html" %}

{% block content %}
<section class="password-reset">
  <div class="reset-card">
    <div class="reset-header">
      <h1>Reset Password</h1>
      <p>Enter the OTP sent to <strong>{{ email }}</strong> and your new password</p>
    </div>
    <form id="resetPasswordOtpForm" method="POST" class="reset-form">
      <input type="hidden" name="email" value="{{ email }}">
      <div class="form-group floating-label-group">
        <input type="text" id="otp" name="otp" required placeholder=" " maxlength="6" pattern="\d{6}" inputmode="numeric">
        <label for="otp">OTP Code</label>
      </div>
      <div class="form-group floating-label-group">
        <input type="password" id="new_password" name="new_password" required placeholder=" " minlength="8">
        <label for="new_password">New Password</label>
      </div>
      <div class="form-group floating-label-group">
        <input type="password" id="confirm_password" name="confirm_password" required placeholder=" ">
        <label for="confirm_password">Confirm Password</label>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">
        <span class="btn-text">Reset Password</span>
        <i class="fas fa-spinner fa-spin loading-icon" style="display: none;"></i>
      </button>
    </form>
    <div class="reset-footer">
      <p>Remember your password? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('resetPasswordOtpForm');
  const submitBtn = form.querySelector('button[type="submit"]');
  const btnText = submitBtn.querySelector('.btn-text');
  const loadingIcon = submitBtn.querySelector('.loading-icon');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    const otp = document.getElementById('otp').value;
    const password = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('confirm_password').value;

    if (!/^\d{6}$/.test(otp)) {
      showToast('OTP must be 6 digits', 'error');
      return;
    }

    if (password !== confirmPassword) {
      showToast('Passwords do not match', 'error');
      return;
    }

    btnText.textContent = 'Processing...';
    loadingIcon.style.display = 'inline-block';

    try {
      const response = await fetch('/reset-password-otp', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          email: '{{ email }}',
          otp: otp,
          new_password: password,
          confirm_password: confirmPassword
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Password reset failed');
      }

      showToast('Password reset successfully!', 'success');
      setTimeout(() => {
        window.location.href = data.redirect || '/';
      }, 1500);

    } catch (error) {
      showToast(error.message || 'An error occurred', 'error');
    } finally {
      btnText.textContent = 'Reset Password';
      loadingIcon.style.display = 'none';
    }
  });

  function showToast(message, type) {
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;
    document.body.appendChild(toast);

    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }
});
</script>

<style>
/* Same styles as reset-password.html */
.password-reset {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 2rem;
  background-color: #f8f9fa;
}

.reset-card {
  background: white;
  border-radius: 10px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  padding: 2rem;
  width: 100%;
  max-width: 400px;
}

.reset-header {
  text-align: center;
  margin-bottom: 1.5rem;
}

.reset-header h1 {
  font-size: 1.8rem;
  color: #2d3748;
  margin-bottom: 0.5rem;
}

.reset-header p {
  color: #718096;
  font-size: 0.9rem;
}

.reset-form {
  margin-bottom: 1.5rem;
}

.reset-footer {
  text-align: center;
  font-size: 0.9rem;
  color: #718096;
  margin-top: 1rem;
}

.reset-footer a {
  color: #4361ee;
  text-decoration: none;
  font-weight: 500;
}

.reset-footer a:hover {
  text-decoration: underline;
}

.loading-icon {
  margin-left: 0.5rem;
}

.toast {
  position: fixed;
  top: 20px;
  right: 20px;
  padding: 8px 16px;
  border-radius: 4px;
  color: white;
  opacity: 0;
  transition: opacity 0.3s ease;
  z-index: 1000;
  font-size: 0.85rem;
  max-width: 250px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.toast.show {
  opacity: 1;
}

.toast-success {
  background-color: #28a745;
}

.toast-error {
  background-color: #dc3545;
}

@media (max-width: 480px) {
  .password-reset {
    padding: 1rem;
  }

  .reset-card {
    padding: 1.5rem;
  }

  .reset-header h1 {
    font-size: 1.5rem;
  }

  .toast {
    top: 10px;
    right: 10px;
    max-width: calc(100% - 20px);
  }
}
</style>
{% endblock %}
