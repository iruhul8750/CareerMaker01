{% extends "base.html" %}

{% block content %}
<section class="password-reset">
  <div class="reset-card">
    <div class="reset-header">
      <h1>Reset Password</h1>
      <p>Enter your email to receive a verification OTP</p>
    </div>
    <form id="resetPasswordForm" method="POST" class="reset-form">
      <div class="form-group floating-label-group">
        <input type="email" id="email" name="email" required placeholder=" ">
        <label for="email">Email Address</label>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">
        <span class="btn-text">Send OTP</span>
        <i class="fas fa-spinner fa-spin loading-icon" style="display: none;"></i>
      </button>
    </form>
    <div id="formResponse" class="form-response" style="display: none;"></div>
    <div class="reset-footer">
      <p>Remember your password? <a href="/" id="loginLink">Login here</a></p>
    </div>
  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('resetPasswordForm');
  const submitBtn = form.querySelector('button[type="submit"]');
  const btnText = submitBtn.querySelector('.btn-text');
  const loadingIcon = submitBtn.querySelector('.loading-icon');
  const formResponse = document.getElementById('formResponse');
  const loginLink = document.getElementById('loginLink');

  // OTP Sending Handler
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    btnText.textContent = 'Sending...';
    loadingIcon.style.display = 'inline-block';
    formResponse.style.display = 'none';

    const formData = new FormData(form);

    fetch("{{ url_for('reset_password') }}", {
      method: 'POST',
      body: formData,
      headers: {
        'Accept': 'application/json'
      }
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === 'success') {
        formResponse.className = 'form-response success';
        formResponse.textContent = 'OTP sent successfully! Please check your email.';
        setTimeout(() => {
          window.location.href = "{{ url_for('reset_password_otp') }}?email=" + encodeURIComponent(formData.get('email'));
        }, 1500);
      } else {
        throw new Error(data.error || 'Failed to send OTP');
      }
    })
    .catch(error => {
      formResponse.className = 'form-response error';
      formResponse.textContent = error.message || 'An error occurred. Please try again.';
      formResponse.style.display = 'block';
    })
    .finally(() => {
      btnText.textContent = 'Send OTP';
      loadingIcon.style.display = 'none';
    });
  });

  // Login Link Handler - Fixed version
  if (loginLink) {
    loginLink.addEventListener('click', function(e) {
      e.preventDefault();
      // Set flag to show login modal on home page
      sessionStorage.setItem('showLoginModal', 'true');
      // Redirect to home page
      window.location.href = '/';
    });
  }
});
</script>

<style>
.password-reset {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 2rem;
  background-color: #f8f9fa;
}

.reset-card {
  background: white;
  border-radius: 10px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  padding: 2rem;
  width: 100%;
  max-width: 400px;
}

.reset-header {
  text-align: center;
  margin-bottom: 1.5rem;
}

.reset-header h1 {
  font-size: 1.8rem;
  color: #2d3748;
  margin-bottom: 0.5rem;
}

.reset-header p {
  color: #718096;
  font-size: 0.9rem;
}

.reset-form {
  margin-bottom: 1.5rem;
}

.reset-footer {
  text-align: center;
  font-size: 0.9rem;
  color: #718096;
  margin-top: 1rem;
}

.reset-footer a {
  color: #4361ee;
  text-decoration: none;
  font-weight: 500;
}

.reset-footer a:hover {
  text-decoration: underline;
}

.form-response {
  padding: 0.75rem;
  border-radius: 4px;
  margin-bottom: 1rem;
  display: none;
}

.form-response.success {
  background-color: #d1fae5;
  color: #065f46;
  border: 1px solid #a7f3d0;
}

.form-response.error {
  background-color: #fee2e2;
  color: #b91c1c;
  border: 1px solid #fecaca;
}

.loading-icon {
  margin-left: 0.5rem;
}

@media (max-width: 480px) {
  .password-reset {
    padding: 1rem;
  }

  .reset-card {
    padding: 1.5rem;
  }

  .reset-header h1 {
    font-size: 1.5rem;
  }
}
</style>
{% endblock %}
