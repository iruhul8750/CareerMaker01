{% extends "base.html" %}

{% block content %}
<section class="password-reset">
  <div class="reset-card">
    <div class="reset-header">
      <h1>Reset Password</h1>
      <p>Enter your email to receive a verification OTP</p>
    </div>
    <form id="resetPasswordForm" method="POST" class="reset-form">
      <div class="form-group floating-label-group">
        <input type="email" id="email" name="email" required placeholder=" ">
        <label for="email">Email Address</label>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">
        <span class="btn-text">Send OTP</span>
        <i class="fas fa-spinner fa-spin loading-icon" style="display: none;"></i>
      </button>
    </form>
    <div class="reset-footer">
      <p>Remember your password? <a href="/?showLogin=true">Login here</a></p>
    </div>
  </div>
</section>

<script>
// This script handles the reset password form submission
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('resetPasswordForm');
  const submitBtn = form.querySelector('button[type="submit"]');
  const btnText = submitBtn.querySelector('.btn-text');
  const loadingIcon = submitBtn.querySelector('.loading-icon');

  // OTP Sending Handler
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    btnText.textContent = 'Sending...';
    loadingIcon.style.display = 'inline-block';

    const formData = new FormData(form);

    fetch("{{ url_for('reset_password') }}", {
      method: 'POST',
      body: formData,
      headers: {
        'Accept': 'application/json'
      }
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === 'success') {
        showToast('OTP sent successfully!', 'success');
        setTimeout(() => {
          window.location.href = "{{ url_for('reset_password_otp') }}?email=" + encodeURIComponent(formData.get('email'));
        }, 1500);
      } else {
        throw new Error(data.error || 'Failed to send OTP');
      }
    })
    .catch(error => {
      showToast(error.message || 'An error occurred', 'error');
    })
    .finally(() => {
      btnText.textContent = 'Send OTP';
      loadingIcon.style.display = 'none';
    });
  });

  function showToast(message, type) {
    // Remove existing toasts if any
    const existingToasts = document.querySelectorAll('.toast');
    existingToasts.forEach(toast => toast.remove());

    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;
    document.body.appendChild(toast);

    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }
});
</script>

<style>
.password-reset {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 2rem;
  background-color: #f8f9fa;
}

.reset-card {
  background: white;
  border-radius: 10px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  padding: 2rem;
  width: 100%;
  max-width: 400px;
}

.reset-header {
  text-align: center;
  margin-bottom: 1.5rem;
}

.reset-header h1 {
  font-size: 1.8rem;
  color: #2d3748;
  margin-bottom: 0.5rem;
}

.reset-header p {
  color: #718096;
  font-size: 0.9rem;
}

.reset-form {
  margin-bottom: 1.5rem;
}

.reset-footer {
  text-align: center;
  font-size: 0.9rem;
  color: #718096;
  margin-top: 1rem;
}

.reset-footer a {
  color: #4361ee;
  text-decoration: none;
  font-weight: 500;
}

.reset-footer a:hover {
  text-decoration: underline;
}

.loading-icon {
  margin-left: 0.5rem;
}

.toast {
  position: fixed;
  top: 20px;
  right: 20px;
  padding: 8px 16px;
  border-radius: 4px;
  color: white;
  opacity: 0;
  transition: opacity 0.3s ease;
  z-index: 1000;
  font-size: 0.85rem;
  max-width: 250px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.toast.show {
  opacity: 1;
}

.toast-success {
  background-color: #28a745;
}

.toast-error {
  background-color: #dc3545;
}

@media (max-width: 480px) {
  .password-reset {
    padding: 1rem;
  }

  .reset-card {
    padding: 1.5rem;
  }

  .reset-header h1 {
    font-size: 1.5rem;
  }

  .toast {
    top: 10px;
    right: 10px;
    max-width: calc(100% - 20px);
  }
}
</style>
{% endblock %}
