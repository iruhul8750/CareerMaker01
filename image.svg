<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern Gradient Background -->
  <rect width="1200" height="630" fill="url(#paint0_radial)"/>

  <!-- Abstract Geometric Shapes -->
  <circle cx="-50" cy="150" r="200" fill="url(#paint1_radial)" fill-opacity="0.4"/>
  <circle cx="1250" cy="480" r="250" fill="url(#paint2_radial)" fill-opacity="0.4"/>

  <!-- Floating Particles -->
  <g opacity="0.3">
    <circle cx="200" cy="100" r="4" fill="#FFD700"/>
    <circle cx="250" cy="180" r="6" fill="#4A6CF7"/>
    <circle cx="300" cy="80" r="3" fill="#10B981"/>
    <circle cx="400" cy="220" r="5" fill="#F59E0B"/>
    <circle cx="800" cy="120" r="4" fill="#EF4444"/>
    <circle cx="900" cy="200" r="6" fill="#4A6CF7"/>
    <circle cx="1000" cy="150" r="3" fill="#FFD700"/>
    <circle cx="1100" cy="180" r="5" fill="#10B981"/>
  </g>

  <!-- Main Content Area with Glass Effect -->
  <rect x="80" y="80" width="1040" height="470" rx="40" fill="white" fill-opacity="0.1" stroke="white" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Left Side - Main Text -->
  <g transform="translate(120, 150)">
    <text font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="white" fill-opacity="0.8">WELCOME TO</text>
    <text x="0" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="white">CareerMaker</text>
    <text x="0" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="white" fill-opacity="0.9">Your Gateway to Professional Excellence</text>

    <!-- Decorative Line -->
    <rect x="0" y="160" width="100" height="4" rx="2" fill="url(#paint3_linear)"/>
  </g>

  <!-- Floating Icons Circle -->
  <g transform="translate(750, 200)">
    <!-- Main Circle -->
    <circle cx="0" cy="0" r="140" fill="white" fill-opacity="0.15" stroke="white" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 8"/>

    <!-- Course Icon - Top -->
    <g transform="translate(0, -100)">
      <circle cx="0" cy="0" r="35" fill="white" fill-opacity="0.2" stroke="#4A6CF7" stroke-width="3"/>
      <text x="0" y="8" font-family="Arial" font-size="32" fill="#4A6CF7" text-anchor="middle">📚</text>
    </g>

    <!-- Job Icon - Right -->
    <g transform="translate(90, -30)">
      <circle cx="0" cy="0" r="35" fill="white" fill-opacity="0.2" stroke="#10B981" stroke-width="3"/>
      <text x="0" y="8" font-family="Arial" font-size="32" fill="#10B981" text-anchor="middle">💼</text>
    </g>

    <!-- Internship Icon - Bottom Right -->
    <g transform="translate(60, 70)">
      <circle cx="0" cy="0" r="35" fill="white" fill-opacity="0.2" stroke="#F59E0B" stroke-width="3"/>
      <text x="0" y="8" font-family="Arial" font-size="32" fill="#F59E0B" text-anchor="middle">🎓</text>
    </g>

    <!-- Blog Icon - Bottom Left -->
    <g transform="translate(-60, 70)">
      <circle cx="0" cy="0" r="35" fill="white" fill-opacity="0.2" stroke="#EF4444" stroke-width="3"/>
      <text x="0" y="8" font-family="Arial" font-size="32" fill="#EF4444" text-anchor="middle">📝</text>
    </g>

    <!-- Left Icon -->
    <g transform="translate(-90, -30)">
      <circle cx="0" cy="0" r="35" fill="white" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="3"/>
      <text x="0" y="8" font-family="Arial" font-size="32" fill="#8B5CF6" text-anchor="middle">🚀</text>
    </g>

    <!-- Center Icon -->
    <circle cx="0" cy="0" r="45" fill="url(#paint4_radial)" stroke="white" stroke-width="3"/>
    <text x="0" y="12" font-family="Arial" font-size="40" fill="white" text-anchor="middle">⭐</text>
  </g>

  <!-- Bottom Stats Cards - More Visual -->
  <g transform="translate(120, 400)">
    <!-- Students Card -->
    <rect x="0" y="0" width="200" height="100" rx="20" fill="white" fill-opacity="0.15" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
    <text x="30" y="35" font-family="Arial" font-size="32" fill="#FFD700">👥</text>
    <text x="80" y="40" font-family="Arial" font-size="28" font-weight="bold" fill="white">10K+</text>
    <text x="30" y="70" font-family="Arial" font-size="16" fill="white" fill-opacity="0.8">Students</text>
  </g>

  <g transform="translate(340, 400)">
    <!-- Companies Card -->
    <rect x="0" y="0" width="200" height="100" rx="20" fill="white" fill-opacity="0.15" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
    <text x="30" y="35" font-family="Arial" font-size="32" fill="#4A6CF7">🏢</text>
    <text x="80" y="40" font-family="Arial" font-size="28" font-weight="bold" fill="white">500+</text>
    <text x="30" y="70" font-family="Arial" font-size="16" fill="white" fill-opacity="0.8">Companies</text>
  </g>

  <g transform="translate(560, 400)">
    <!-- Courses Card -->
    <rect x="0" y="0" width="200" height="100" rx="20" fill="white" fill-opacity="0.15" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
    <text x="30" y="35" font-family="Arial" font-size="32" fill="#10B981">📖</text>
    <text x="80" y="40" font-family="Arial" font-size="28" font-weight="bold" fill="white">250+</text>
    <text x="30" y="70" font-family="Arial" font-size="16" fill="white" fill-opacity="0.8">Courses</text>
  </g>

  <g transform="translate(780, 400)">
    <!-- Placements Card -->
    <rect x="0" y="0" width="200" height="100" rx="20" fill="white" fill-opacity="0.15" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
    <text x="30" y="35" font-family="Arial" font-size="32" fill="#F59E0B">💼</text>
    <text x="80" y="40" font-family="Arial" font-size="28" font-weight="bold" fill="white">95%</text>
    <text x="30" y="70" font-family="Arial" font-size="16" fill="white" fill-opacity="0.8">Placement Rate</text>
  </g>

  <!-- Abstract Lines -->
  <path d="M200 550 L400 520 L600 540 L800 510 L1000 530" stroke="white" stroke-width="2" stroke-opacity="0.2" fill="none" stroke-dasharray="10 10"/>

  <!-- Floating Stars -->
  <g opacity="0.6">
    <circle cx="500" cy="300" r="3" fill="#FFD700"/>
    <circle cx="520" cy="310" r="2" fill="#FFD700"/>
    <circle cx="540" cy="295" r="4" fill="#FFD700"/>
    <circle cx="450" cy="250" r="2" fill="#FFD700"/>
    <circle cx="600" cy="280" r="3" fill="#FFD700"/>
  </g>

  <!-- Gradient Definitions -->
  <defs>
    <radialGradient id="paint0_radial" cx="0.5" cy="0.5" r="0.8" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#667EEA"/>
      <stop offset="50%" stop-color="#764BA2"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </radialGradient>

    <radialGradient id="paint1_radial" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="paint2_radial" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#4A6CF7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4A6CF7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="paint3_linear" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#4A6CF7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <radialGradient id="paint4_radial" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
  </defs>
</svg>